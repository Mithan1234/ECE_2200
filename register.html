<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Blood Bank</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

    <!-- Header Navigation -->
    <header class="navbar">
        <div class="logo">
            <a href="index.html"><h2>🩸 Blood Bank</h2></a>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="login.html" class="btn-login">Login</a></li>
            </ul>
        </nav>
    </header>

    <!-- Registration Container -->
    <main class="form-wrapper">
        <div class="form-card">
            <h2>Create an Account</h2>
            <p class="form-subtitle">Register to donate or request blood in your community</p>

            <form action="login.html" method="GET">
                <!-- Full Name -->
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="e.g. mithan.ece19@mail.com" required>
                </div>

                <!-- Phone -->
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="e.g. 017##-######" required>
                </div>

                <!-- Blood Group Selection -->
                <div class="form-group">
                    <label for="bloodgroup">Blood Group</label>
                    <select id="bloodgroup" name="bloodgroup" required>
                        <option value="" disabled selected>Select Your Blood Group</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                    </select>
                </div>

                <!-- Age & Gender in a two-column row -->
                <div class="form-row">
                    <div class="form-group half-width">
                        <label for="age">Age</label>
                        <input type="number" id="age" name="age" min="18" max="65" placeholder="18-65" required>
                    </div>
                    <div class="form-group half-width">
                        <label for="gender">Gender</label>
                        <select id="gender" name="gender" required>
                             <option value="" disabled selected>Select Your Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Create a strong password" required>
                </div>

                <!-- Confirm Password -->
                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-type your password" required>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary btn-block">Register</button>
            </form>

            <div class="form-footer">
                <p>Already have an account? <a href="login.html">Login here</a></p>
                <p><a href="index.html">← Back to Home</a></p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Blood Bank develop by ECE department of RUET.</p>
    </footer>

</body>
</html>
