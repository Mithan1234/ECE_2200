<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LifeDrop Blood Bank</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

    <!-- Small Navigation Header -->
    <header class="navbar">
        <div class="logo">
            <a href="index.html"><h2>🩸 Blood Bank</h2></a>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="register.html" class="btn-register">Register</a></li>
            </ul>
        </nav>
    </header>

    <!-- Login Container -->
    <main class="form-wrapper">
        <div class="form-card">
            <h2>User Login</h2>
            <p class="form-subtitle">Please enter your credentials to access your account</p>

            <form action="dashboard.html" method="GET">
                <!-- Email Field -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="e.g. mithan.ece19@mail.com" required>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>

                <!-- Role Selection -->
                <div class="form-group">
                    <label for="role">Login As</label>
                    <select id="role" name="role" required>
                        <option value="user">User (Donor / Receiver)</option>
                        <option value="admin">Administrator</option>
                    </select>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary btn-block">Sign In</button>
            </form>

            <div class="form-footer">
                <p>Don't have an account? <a href="register.html">Register here</a></p>
                <p><a href="index.html">← Back to Home</a></p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
         <p>&copy; 2026 Blood Bank develop by ECE department of RUET.</p>
    </footer>

</body>
</html>
